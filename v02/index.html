<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9d8d4">
  <meta name="description" content="Preparación comunitaria para emergencias: necesidades, familia, listas, compras, plan, mapa y modo emergencia.">
  <title>Barrio Listo V02</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Jost:wght@400;500;600&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <a href="#inicio" class="marca">Barrio Listo <small>V02</small></a>
    <span class="rejilla" aria-hidden="true"></span>
    <span class="reloj" id="reloj">72:00 HS</span>
    <button type="button" class="boton chico" id="instalar" hidden>Instalar</button>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav class="navegacion" aria-label="Principal">
    <a href="#inicio" data-ruta="inicio"><i class="led" aria-hidden="true"></i>Inicio</a>
    <a href="#inventario" data-ruta="inventario"><i class="led" aria-hidden="true"></i>Stock</a>
    <a href="#familia" data-ruta="familia"><i class="led" aria-hidden="true"></i>Familia</a>
    <a href="#red" data-ruta="red"><i class="led" aria-hidden="true"></i>Red</a>
    <a href="#emergencia" data-ruta="emergencia" class="sos"><i class="led" aria-hidden="true"></i>SOS</a>
  </nav>

  <div id="linterna" class="linterna" hidden>
    <p>Linterna encendida. Tocá la pantalla para apagarla.</p>
  </div>

  <dialog id="dialogo" aria-labelledby="dialogo-titulo"></dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
